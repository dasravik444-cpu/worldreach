# Shared settings of every UK city (config/gb/<city>.toml includes this file).
#
# UK rules (docs/COMPLIANCE.md): limited companies (Ltd / LLP / PLC) may be e-mailed without having asked, when the
# e-mail says who writes and how to stop it; sole traders and partnerships need consent, so they are NOT e-mailed
# (the Legal Form column shows which is which). Every e-mail says where the address came from (UK GDPR Art. 14).

[campaign]
country = "GB"
language = "en"
region = "uk"

[sheets]
enabled = true
leads_tab = "Leads UK"
plan_tab = ""
report_tab = "Lead Report"
require_any = ["email", "whatsapp"]
checkpoint_minutes = 20

[filters]
require_contact = true
exclude_closed = true
allow_unmatched_categories = false
exclude_chains = [
  "mcdonald", "kfc", "burger king", "subway", "greggs", "costa", "starbucks", "caffe nero", "caffè nero", "pret",
  "nando", "wagamama", "pizza express", "pizzaexpress", "zizzi", "ask italian", "prezzo", "frankie & benny",
  "harvester", "toby carvery", "wetherspoon", "all bar one", "slug and lettuce", "browns", "miller & carter",
  "five guys", "leon", "itsu", "wasabi", "tortilla", "gourmet burger kitchen", "honest burgers", "pizza hut",
  "domino", "papa john", "toni&guy", "toni & guy", "rush hair", "headmasters", "regis", "supercuts",
  "puregym", "pure gym", "the gym group", "anytime fitness", "david lloyd", "nuffield health", "virgin active",
  "bannatyne", "everlast gyms", "jd gyms", "snap fitness", "f45", "energie fitness", "better gym", "fitness first",
  "premier inn", "travelodge", "holiday inn", "ibis", "hilton", "marriott", "best western", "jurys inn", "novotel",
  "mercure", "doubletree", "crowne plaza", "village hotel", "kwik fit", "halfords", "ats euromaster", "national tyres",
  "pets at home", "champneys",
]
exclude_name_words = ["adult", "erotic", "strip club", "gentlemen's club", "escort", "vape"]

[plan]
days = 7                 # each city is split into 7 parts, the centre first
daily_target = "auto"
order = "center_out"
min_cell_km = 1.0
max_cell_km = 8.0
split_threshold = 60
finish_scheduled_part = true

[compliance]
mode = "open-data"       # Overture Maps + OpenStreetMap + the businesses' own websites (no Google scraping)

[open_data]
min_confidence = 0.5
refresh_days = 30
exclude_codes = ["internet_cafe", "cafeteria", "hookah_bar", "gas_station", "convenience_store", "hostel"]

[enrich]
website = true
max_pages_per_site = 6
social_search = false
instagram_profile = false
check_email_mx = true
role_email_candidates = false   # no guessed info@ addresses: every bounce costs a mailbox its reputation
email_hunt = true
email_archive = true      # sites that do not answer us: their archived pages from Common Crawl (open web archive)
email_search = false      # no reading of search-engine result pages (their terms forbid it; BRAVE_API_KEY is the official way)
workers = 6               # websites read at the same time (the tablet shares its memory with two other robots)
site_interval_s = 2.0

[crawler]
bot_name = "WorldReachBot"
contact_url = ""

[runtime]
time_budget_minutes = 120
safety_margin_minutes = 6
use_curl_cffi = false
